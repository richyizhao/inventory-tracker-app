name: Destroy Prod Resources

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Write backend config
        run: |
          cat <<EOF > infra/environments/prod/backend.hcl
          resource_group_name  = "${{ vars.TFSTATE_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          container_name       = "${{ vars.TFSTATE_CONTAINER }}"
          key                  = "inventory-tracker-prod.tfstate"
          access_key           = "${{ secrets.TFSTATE_ACCESS_KEY }}"
          EOF

      - name: Terraform init
        run: terraform -chdir=infra/environments/prod init -backend-config=backend.hcl

      - name: Read target resource group
        id: infra
        shell: bash
        run: |
          echo "resource_group=$(terraform -chdir=infra/environments/prod output -raw resource_group_name)" >> "$GITHUB_OUTPUT"

      - name: Guard Terraform state resources
        shell: bash
        run: |
          if [ "${{ steps.infra.outputs.resource_group }}" = "${{ vars.TFSTATE_RESOURCE_GROUP }}" ]; then
            echo "Refusing to delete the Terraform state resource group."
            exit 1
          fi

      - name: Delete prod resource group
        run: |
          az group delete \
            --name "${{ steps.infra.outputs.resource_group }}" \
            --yes \
            --no-wait
