name: Deploy Server

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: hashicorp/setup-terraform@v3

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Write backend config
        run: |
          cat <<EOF > infra/environments/prod/backend.hcl
          resource_group_name  = "${{ vars.TFSTATE_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          container_name       = "${{ vars.TFSTATE_CONTAINER }}"
          key                  = "inventory-tracker-prod.tfstate"
          access_key           = "${{ secrets.TFSTATE_ACCESS_KEY }}"
          EOF

      - name: Terraform init
        run: terraform -chdir=infra/environments/prod init -backend-config=backend.hcl

      - name: Read infrastructure outputs
        id: infra
        shell: bash
        run: |
          echo "resource_group=$(terraform -chdir=infra/environments/prod output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "container_app=$(terraform -chdir=infra/environments/prod output -raw api_container_app_name)" >> "$GITHUB_OUTPUT"
          echo "acr_name=$(terraform -chdir=infra/environments/prod output -raw container_registry_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform -chdir=infra/environments/prod output -raw container_registry_login_server)" >> "$GITHUB_OUTPUT"

      - name: Azure Container Registry login
        run: az acr login --name "${{ steps.infra.outputs.acr_name }}"

      - name: Build and push API image
        shell: bash
        run: |
          IMAGE_SHA="${{ steps.infra.outputs.acr_login_server }}/inventory-tracker-api:${GITHUB_SHA}"
          IMAGE_LATEST="${{ steps.infra.outputs.acr_login_server }}/inventory-tracker-api:prod-latest"
          docker build -f server/Dockerfile -t "$IMAGE_SHA" -t "$IMAGE_LATEST" server
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
          echo "IMAGE_SHA=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "${{ steps.infra.outputs.container_app }}" \
            --resource-group "${{ steps.infra.outputs.resource_group }}" \
            --image "$IMAGE_SHA"
