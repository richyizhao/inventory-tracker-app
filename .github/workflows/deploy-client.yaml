name: Deploy Client

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: hashicorp/setup-terraform@v3

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Write backend config
        run: |
          cat <<EOF > infra/environments/prod/backend.hcl
          resource_group_name  = "${{ vars.TFSTATE_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          container_name       = "${{ vars.TFSTATE_CONTAINER }}"
          key                  = "inventory-tracker-prod.tfstate"
          access_key           = "${{ secrets.TFSTATE_ACCESS_KEY }}"
          EOF

      - name: Terraform init
        run: terraform -chdir=infra/environments/prod init -backend-config=backend.hcl

      - name: Read infrastructure outputs
        id: infra
        shell: bash
        run: |
          echo "api_url=$(terraform -chdir=infra/environments/prod output -raw api_container_app_url)" >> "$GITHUB_OUTPUT"
          echo "resource_group=$(terraform -chdir=infra/environments/prod output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "acr_name=$(terraform -chdir=infra/environments/prod output -raw container_registry_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform -chdir=infra/environments/prod output -raw container_registry_login_server)" >> "$GITHUB_OUTPUT"
          echo "frontend_container_app=$(terraform -chdir=infra/environments/prod output -raw frontend_container_app_name)" >> "$GITHUB_OUTPUT"

      - name: Build frontend image in ACR
        run: |
          az acr build \
            --registry "${{ steps.infra.outputs.acr_name }}" \
            --image "inventory-tracker-client:prod-latest" \
            --build-arg "VITE_API_BASE_URL=${{ steps.infra.outputs.api_url }}" \
            --file client/Dockerfile \
            client

      - name: Update frontend Container App image
        run: |
          az containerapp update \
            --name "${{ steps.infra.outputs.frontend_container_app }}" \
            --resource-group "${{ steps.infra.outputs.resource_group }}" \
            --image "${{ steps.infra.outputs.acr_login_server }}/inventory-tracker-client:prod-latest"
