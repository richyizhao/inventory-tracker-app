name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/deploy-infra.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - stage
          - prod
      command:
        description: Terraform command
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check

      - name: Terraform init
        run: terraform -chdir=infra init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra validate

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      TF_VAR_postgres_admin_password: ${{ secrets.TF_VAR_postgres_admin_password }}
      TF_VAR_jwt_key: ${{ secrets.TF_VAR_jwt_key }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write backend config
        run: |
          cat <<EOF > infra/backend.hcl
          resource_group_name  = "${{ secrets.TFSTATE_RESOURCE_GROUP }}"
          storage_account_name = "${{ secrets.TFSTATE_STORAGE_ACCOUNT }}"
          container_name       = "${{ secrets.TFSTATE_CONTAINER }}"
          key                  = "inventory-tracker-${{ inputs.environment }}.tfstate"
          use_azuread_auth     = true
          EOF

      - name: Terraform init
        run: terraform -chdir=infra init -backend-config=backend.hcl

      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Terraform plan
        run: terraform -chdir=infra plan -var-file=environments/${{ inputs.environment }}.tfvars -out=tfplan

      - name: Terraform apply
        if: inputs.command == 'apply'
        run: terraform -chdir=infra apply -auto-approve tfplan
