services:
  server:
    image: ${API_IMAGE}
    container_name: inventory-tracker-server-prod
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      "ConnectionStrings:Default": ${POSTGRES_CONNECTION_STRING}
      "Cors:AllowedOrigins__0": ${CLIENT_ORIGIN}
      "Jwt:Key": ${JWT_KEY}
      "ProductImageStorage:Provider": AzureBlob
      "ProductImageStorage:ConnectionString": ${AZURE_BLOB_CONNECTION_STRING}
      "ProductImageStorage:ContainerName": ${AZURE_BLOB_CONTAINER:-product-images-prod}
    ports:
      - "${API_PORT:-8080}:8080"
